<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Расписание Кирилла</title>
    <style>
        :root {
            --bg-glass: rgba(255, 255, 255, 0.08);
            --border-glass: rgba(255, 255, 255, 0.12);
            --text-main: #ffffff;
            --text-sub: rgba(255, 255, 255, 0.5);
            --accent: #00ffcc;
            --shadow: rgba(0, 0, 0, 0.2);
            --blur: 20px;
        }
        [data-theme="light"] {
            --bg-glass: rgba(0, 0, 0, 0.05);
            --border-glass: rgba(0, 0, 0, 0.08);
            --text-main: #1d1d1f;
            --text-sub: rgba(0, 0, 0, 0.4);
            --accent: #ff3b30;
            --shadow: rgba(0, 0, 0, 0.05);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #000;
            color: var(--text-main);
            transition: color 0.5s ease;
        }
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            transform: scale(1.05);
            transition: transform 0.1s ease-out;
        }
        .swiper-container {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .slide {
            min-width: 100%;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
            padding-top: calc(20px + env(safe-area-inset-top));
            justify-content: space-between;
        }
        .header-widget {
            text-align: center;
            margin-top: 10px;
            transition: transform 0.2s ease-out;
        }
        .header-widget h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }
        .timer-card {
            background: var(--bg-glass);
            backdrop-filter: blur(var(--blur));
            -webkit-backdrop-filter: blur(var(--blur));
            border: 1px solid var(--border-glass);
            border-radius: 28px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 8px 32px var(--shadow);
            margin: 20px 0;
        }
        .timer-status {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-sub);
            margin-bottom: 8px;
            font-weight: 600;
        }
        .timer-countdown {
            font-size: 54px;
            font-weight: 900;
            letter-spacing: -2px;
            line-height: 1;
            margin-bottom: 4px;
        }
        .timer-sub {
            font-size: 14px;
            color: var(--text-sub);
            font-weight: 500;
        }
        .day-schedule-box {
            background: var(--bg-glass);
            backdrop-filter: blur(var(--blur));
            -webkit-backdrop-filter: blur(var(--blur));
            border: 1px solid var(--border-glass);
            border-radius: 28px;
            padding: 16px;
            flex-grow: 1;
            max-height: 48vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: 0 8px 32px var(--shadow);
        }
        .day-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 12px;
            text-align: center;
            opacity: 0.8;
        }
        .lessons-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow-y: auto;
        }
        .lesson-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid transparent;
            transition: all 0.3s ease;
        }
        .lesson-row.active {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
        }
        .lesson-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .lesson-num {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-sub);
            width: 18px;
        }
        .lesson-row.active .lesson-num {
            color: var(--accent);
        }
        .lesson-name {
            font-size: 15px;
            font-weight: 600;
        }
        .lesson-meta {
            font-size: 13px;
            color: var(--text-sub);
            text-align: right;
        }
        .week-matrix-box {
            background: var(--bg-glass);
            backdrop-filter: blur(var(--blur));
            -webkit-backdrop-filter: blur(var(--blur));
            border: 1px solid var(--border-glass);
            border-radius: 28px;
            padding: 16px;
            height: 82vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 32px var(--shadow);
            margin-top: 10px;
        }
        .matrix-grid {
            display: grid;
            grid-template-columns: 24px repeat(5, 1fr);
            grid-template-rows: auto repeat(8, 1fr);
            gap: 4px;
            height: 100%;
            width: 100%;
        }
        .matrix-cell {
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 10px;
            font-weight: 600;
            border-radius: 6px;
            padding: 2px;
            background: rgba(255, 255, 255, 0.02);
            line-height: 1.1;
        }
        .matrix-cell.header, .matrix-cell.num-col {
            background: transparent;
            font-weight: 800;
            color: var(--text-sub);
        }
        .matrix-cell.empty {
            background: transparent;
            border: 1px dashed rgba(255, 255, 255, 0.05);
            color: transparent;
        }
        .bottom-controls {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 15px;
        }
        .icon-btn {
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            color: var(--text-sub);
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }
        .icon-btn svg { width: 18px; height: 18px; fill: currentColor; }
        .page-dots { display: flex; justify-content: center; gap: 6px; margin-top: 10px; }
        .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-sub); opacity: 0.4; }
        .dot.active { opacity: 1; width: 16px; border-radius: 3px; background: var(--text-main); }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    <div class="swiper-container" id="swiper">
        <!-- СЛАЙД 1 -->
        <div class="slide">
            <div class="header-widget" id="header1"><h1>Расписание Кирилла</h1></div>
            <div class="timer-card">
                <div class="timer-status" id="timer-label">Загрузка...</div>
                <div class="timer-countdown" id="timer-time">00:00</div>
                <div class="timer-sub" id="timer-sub">анализ уроков...</div>
            </div>
            <div class="day-schedule-box">
                <div class="day-title" id="day-title">Сегодня</div>
                <div class="lessons-list" id="day-lessons"></div>
            </div>
            <div class="page-dots"><div class="dot active"></div><div class="dot"></div></div>
            <div class="bottom-controls">
                <button class="icon-btn" id="theme-toggle">
                    <svg viewBox="0 0 24 24"><path d="M12 3c.132 0 .263 0 .393.007a7.5 7.5 0 0 0 7.92 12.446A9 9 0 1 1 12 3z"/></svg>
                </button>
                <button class="icon-btn" id="bg-generate">
                    <svg viewBox="0 0 24 24"><path d="M19 8l-4 4h3c0 3.31-2.69 6-6 6a5.87 5.87 0 0 1-2.8-.7l-1.46 1.46A7.93 7.93 0 0 0 12 20c4.42 0 8-3.58 8-8h3l-4-4zM6 12c0-3.31 2.69-6 6-6 1.01 0 1.97.25 2.8.7l1.46-1.46A7.93 7.93 0 0 0 12 4c-4.42 0-8 3.58-8 8H1l4 4 4-4H6z"/></svg>
                </button>
            </div>
        </div>
        <!-- СЛАЙД 2 -->
        <div class="slide">
            <div class="header-widget" id="header2"><h1>Вся неделя</h1></div>
            <div class="week-matrix-box"><div class="matrix-grid" id="matrix-grid"></div></div>
            <div class="page-dots"><div class="dot"></div><div class="dot active"></div></div>
            <div class="bottom-controls"><div style="width:40px;"></div><div style="width:40px;"></div></div>
        </div>
    </div>
    <script>
        const timeTable = [
            { num: 1, start: "08:30", end: "09:10" },
            { num: 2, start: "09:20", end: "10:00" },
            { num: 3, start: "10:20", end: "11:00" },
            { num: 4, start: "11:10", end: "11:50" },
            { num: 5, start: "12:10", end: "12:50" },
            { num: 6, start: "13:10", end: "13:50" },
            { num: 7, start: "14:00", end: "14:40" },
            { num: 8, start: "14:50", end: "15:30" }
        ];

        const daysData = {
            1: { name: "Понедельник", short: "Пн", lessons: { 1: "Физика", 2: "Литер.", 3: "История", 4: "Алгебра", 5: "Вероятн.", 6: "Физра", 7: "Информ." }, rooms: {1:"301", 2:"308", 3:"210", 4:"313", 5:"313", 6:"Зал", 7:"301"} },
            2: { name: "Вторник", short: "Вт", lessons: { 2: "Геогр.", 3: "Труд", 4: "История", 5: "Русский", 6: "Музыка", 7: "Алгебра", 8: "Геометр." }, rooms: {2:"306", 3:"201", 4:"210", 5:"308", 6:"303", 7:"313", 8:"313"} },
            3: { name: "Среда", short: "Ср", lessons: { 1: "ОБЗР", 2: "Биолог.", 3: "Физра", 4: "Англ.", 5: "Физика", 6: "Геогр." }, rooms: {1:"203", 2:"306", 3:"Зал", 4:"305", 5:"301", 6:"306"} },
            4: { name: "Четверг", short: "Чт", lessons: { 3: "Биолог.", 4: "Англ.", 5: "История", 6: "Русский", 7: "Химия" }, rooms: {3:"203", 4:"305", 5:"210", 6:"308", 7:"316"} },
            5: { name: "Пятница", short: "Пт", lessons: { 3: "Химия", 4: "Алгебра", 5: "Русский", 6: "Англ.", 7: "Литер.", 8: "Геометр." }, rooms: {3:"316", 4:"313", 5:"308", 6:"305", 7:"308", 8:"313"} }
        };

        const currentHour = new Date().getHours();
        document.documentElement.setAttribute('data-theme', (currentHour < 7 || currentHour >= 19) ? 'dark' : 'light');

        document.getElementById('theme-toggle').addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            document.documentElement.setAttribute('data-theme', currentTheme === 'dark' ? 'light' : 'dark');
            generateFluidBackground();
        });

        const swiper = document.getElementById('swiper');
        let startX = 0, currentIdx = 0;
        window.addEventListener('touchstart', e => startX = e.touches.clientX);
        window.addEventListener('touchend', e => {
            const diffX = e.changedTouches.clientX - startX;
            if (Math.abs(diffX) > 60) {
                if (diffX > 0 && currentIdx > 0) currentIdx--;
                if (diffX < 0 && currentIdx < 1) currentIdx++;
                swiper.style.transform = `translateX(-${currentIdx * 100}%)`;
                generateFluidBackground();
            }
        });

        function buildMatrix() {
            const grid = document.getElementById('matrix-grid');
            grid.innerHTML = '';
            let corner = document.createElement('div');
            corner.className = 'matrix-cell header'; corner.innerText = '№'; grid.appendChild(corner);

            for (let d = 1; d <= 5; d++) {
                let cell = document.createElement('div');
                cell.className = 'matrix-cell header'; cell.innerText = daysData[d].short; grid.appendChild(cell);
            }
            for (let l = 1; l <= 8; l++) {
                let numCell = document.createElement('div');
                numCell.className = 'matrix-cell num-col'; numCell.innerText = l; grid.appendChild(numCell);
                for (let d = 1; d <= 5; d++) {
                    let cell = document.createElement('div');
                    const lessonName = daysData[d].lessons[l];
                    cell.className = lessonName ? 'matrix-cell' : 'matrix-cell empty';
                    if (lessonName) cell.innerText = lessonName;
                    grid.appendChild(cell);
                }
            }
        }

        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() { canvas.width = window.innerWidth * 1.1; canvas.height = window.innerHeight * 1.1; generateFluidBackground(); }

        function generateFluidBackground() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            const darkPalettes = [['#0f172a', '#1e1b4b', '#2e1065'], ['#050b14', '#0d1b2a', '#1b263b']];
            const lightPalettes = [['#f8fafc', '#f1f5f9', '#cbd5e1'], ['#f4f4f9', '#e8e8f4', '#c8c8e6']];
            const list = isDark ? darkPalettes : lightPalettes;
            const palette = list[Math.floor(Math.random() * list.length)];

            let grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            grad.addColorStop(0, palette[0]); grad.addColorStop(0.5, palette[1]); grad.addColorStop(1, palette[2]);
            ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);

            for(let i=0; i<2; i++) {
                ctx.beginPath();
                let x = Math.random() * canvas.width; let y = Math.random() * canvas.height;
                let r = Math.random() * (canvas.width / 2) + 100;
                let radGrad = ctx.createRadialGradient(x, y, 10, x, y, r);
                radGrad.addColorStop(0, isDark ? 'rgba(0,255,204,0.06)' : 'rgba(255,59,48,0.04)');
                radGrad.addColorStop(1, 'transparent');
                ctx.fillStyle = radGrad; ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
            }
        }

        document.getElementById('bg-generate').addEventListener('click', generateFluidBackground);
        window.addEventListener('resize', resizeCanvas);

        window.addEventListener('deviceorientation', (e) => {
            if (!e.gamma || !e.beta) return;
            const x = e.gamma / 3; const y = e.beta / 3;
            canvas.style.transform = `translate(${x}px, ${y}px) scale(1.05)`;
            document.getElementById('header1').style.transform = `translate(${-x/2}px, ${-y/2}px)`;
            document.getElementById('header2').style.transform = `translate(${-x/2}px, ${-y/2}px)`;
        });

        function parseTime(tStr) { let [h, m] = tStr.split(':').map(Number); return h * 60 + m; }

        function updateLogic() {
            const now = new Date();
            let day = now.getDay(); 
            let currentMinutes = now.getHours() * 60 + now.getMinutes();
            let isWeekend = (day === 0 || day === 6);
            let targetDay = day;

            if (!isWeekend && daysData[day]) {
                const lastLessonNum = Math.max(...Object.keys(daysData[day].lessons).map(Number));
                const lastLessonEnd = parseTime(timeTable[lastLessonNum - 1].end);
                if (currentMinutes > lastLessonEnd) { targetDay = day + 1; if (targetDay > 5) targetDay = 1; }
            } else if (isWeekend) { targetDay = 1; }

            const isDisplayingToday = (targetDay === day);
            const activeDayInfo = daysData[targetDay];
            document.getElementById('day-title').innerText = isDisplayingToday ? `Сегодня (${activeDayInfo.name})` : `Расписание на завтра (${activeDayInfo.name})`;

            const listContainer = document.getElementById('day-lessons');
            listContainer.innerHTML = '';
            let activeLessonId = null;
            let currentStatusText = "Уроки закончены"; let timeDiffText = "--:--"; let subText = "Хорошего отдыха!";

            if (isDisplayingToday && daysData[day]) {
                const todayLessons = daysData[day].lessons;
                const firstLessonNum = Math.min(...Object.keys(todayLessons).map(Number));
                const firstLessonStart = parseTime(timeTable[firstLessonNum - 1].start);

                if (currentMinutes < firstLessonStart) {
                    currentStatusText = "До начала уроков";
                    let diff = firstLessonStart - currentMinutes;
                    timeDiffText = `${Math.floor(diff / 60)}ч ${diff % 60}м`;
                    subText = `Первый урок: ${todayLessons[firstLessonNum]}`;
                } else {
                    for (let lNum of Object.keys(todayLessons).map(Number)) {
                        let tBox = timeTable[lNum - 1];
                        if (currentMinutes >= parseTime(tBox.start) && currentMinutes <= parseTime(tBox.end)) {
                            activeLessonId = lNum; currentStatusText = `Идет ${lNum}-й урок`;
                            timeDiffText = `${parseTime(tBox.end) - currentMinutes} мин`;
                            subText = `До конца урока: ${todayLessons[lNum]}`; break;
                        }
                    }
                    if (!activeLessonId) {
                        const lessonsKeys = Object.keys(todayLessons).map(Number).sort();
                        for (let i = 0; i < lessonsKeys.length - 1; i++) {
                            let currEnd = parseTime(timeTable[lessonsKeys[i] - 1].end);
                            let nextStart = parseTime(timeTable[lessonsKeys[i+1] - 1].start);
                            if (currentMinutes > currEnd && currentMinutes < nextStart) {
                                currentStatusText = "Перемена"; timeDiffText = `${nextStart - currentMinutes} мин`;
                                subText = `Следующий: ${todayLessons[lessonsKeys[i+1]]}`; break;
                            }
                        }
                    }
                }
            } else { currentStatusText = "Уроки завершены"; timeDiffText = "Отдых"; subText = `Следующий день: ${activeDayInfo.name}`; }

            document.getElementById('timer-label').innerText = currentStatusText;
            document.getElementById('timer-time').innerText = timeDiffText;
            document.getElementById('timer-sub').innerText = subText;

            for (let slot = 1; slot <= 8; slot++) {
                const name = activeDayInfo.lessons[slot]; if (!name) continue;
                const row = document.createElement('div');
                row.className = `lesson-row ${activeLessonId === slot ? 'active' : ''}`;
                row.innerHTML = `<div class="lesson-left"><div class="lesson-num">${slot}</div><div class="lesson-name">${name}</div></div><div class="lesson-meta"><div>каб. ${activeDayInfo.rooms[slot]}</div><div style="font-size:11px; opacity:0.6">${timeTable[slot-1].start}</div></div>`;
                listContainer.appendChild(row);
            }
        }

        buildMatrix(); resizeCanvas(); updateLogic(); setInterval(updateLogic, 20000);
    </script>
</body>
</html>
