<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Расписание Кирилла</title>
    
    <!-- Метатеги мобильного приложения для смартфона iQOO Z8 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Защита от кэширования через версии файлов (v=3) -->
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body>

    <!-- Интерактивный генеративный фон на весь экран -->
    <canvas id="bg-canvas"></canvas>

    <!-- Главный контейнер карусели слайдов -->
    <div class="swiper-container" id="swiper">
        
        <!-- СЛАЙД 1: Расписание на один день -->
        <div class="slide">
            <div class="header-widget">
                <h1>Расписание Кирилла</h1>
            </div>

            <!-- Виджет обратного отсчета времени -->
            <div class="timer-card">
                <div class="timer-status" id="timer-label">Загрузка...</div>
                <div class="timer-countdown" id="timer-time">00:00</div>
                <div class="timer-sub" id="timer-sub">анализ уроков...</div>
            </div>

            <!-- Компактный блок текущего дня -->
            <div class="day-schedule-box">
                <div class="day-title" id="day-title">Сегодня</div>
                <div class="lessons-list" id="day-lessons"></div>
            </div>

            <!-- Явные навигационные кнопки-вкладки (Табы) -->
            <div class="navigation-tabs">
                <button class="tab-btn active" onclick="switchScreen(0)">День</button>
                <button class="tab-btn" onclick="switchScreen(1)">Неделя</button>
            </div>
        </div>

        <!-- СЛАЙД 2: Матрица всей недели -->
        <div class="slide">
            <div class="header-widget">
                <h1>Вся неделя</h1>
            </div>

            <!-- Ультракомпактная сетка -->
            <div class="week-matrix-box">
                <div class="matrix-grid" id="matrix-grid"></div>
            </div>

            <!-- Дублирующие навигационные кнопки-вкладки -->
            <div class="navigation-tabs">
                <button class="tab-btn" onclick="switchScreen(0)">День</button>
                <button class="tab-btn active" onclick="switchScreen(1)">Неделя</button>
            </div>
        </div>

    </div>

    <!-- Защита от кэширования скрипта -->
    <script src="script.js?v=3"></script>
</body>
</html>
