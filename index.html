<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расписание Кирилла</title>
    <style>
        :root {
            --bg-overlay: rgba(255, 255, 255, 0.4);
            --card-bg: rgba(255, 255, 255, 0.75);
            --text-main: #1d1d1f;
            --text-muted: #48484a;
            --accent: #0071e3;
            --status-color: #34c759;
            --border-glow: rgba(0, 113, 227, 0.2);
            --glass-blur: blur(20px);
        }
        body.dark-theme {
            --bg-overlay: rgba(0, 0, 0, 0.5);
            --card-bg: rgba(28, 28, 30, 0.8);
            --text-main: #f5f5f7;
            --text-muted: #8e8e93;
            --accent: #2997ff;
            --border-glow: rgba(41, 151, 255, 0.3);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: flex-start;
            background-color: #f5f5f7;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: background 0.5s ease, background-color 0.5s ease;
            box-sizing: border-box;
        }
        .main-wrapper {
            background: var(--bg-overlay);
            padding: 24px;
            border-radius: 28px;
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 10px;
        }
        .controls-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            width: 100%;
        }
        .theme-btn {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-main);
            padding: 10px 16px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            flex: 1;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }
        .bg-select {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 12px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            outline: none;
            flex: 2;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .day-info {
            text-align: center;
            font-weight: 600;
            color: var(--text-muted);
            font-size: 14px;
            background: var(--card-bg);
            padding: 10px;
            border-radius: 14px;
            letter-spacing: -0.2px;
        }
        .child-card {
            background: var(--card-bg);
            border-radius: 22px;
            padding: 24px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
            border: 1px solid var(--border-glow);
            box-sizing: border-box;
            width: 100%;
        }
        .child-name {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 16px;
            color: var(--accent);
            text-align: center;
            letter-spacing: -0.5px;
        }
        .status-box {
            background: rgba(0,0,0,0.02);
            border-radius: 18px;
            padding: 18px;
            text-align: center;
            border: 1px solid rgba(0,0,0,0.03);
        }
        body.dark-theme .status-box {
            background: rgba(255,255,255,0.03);
        }
        .current-lesson {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.2px;
        }
        .timer {
            font-size: 38px;
            font-weight: 900;
            color: var(--status-color);
            margin: 12px 0;
            letter-spacing: -1px;
        }
        .next-break {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.5;
            white-space: pre-line;
            font-weight: 500;
        }
        .full-schedule-box {
            background: var(--card-bg);
            border-radius: 22px;
            padding: 20px;
            box-sizing: border-box;
            width: 100%;
        }
        .schedule-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 12px;
            text-align: center;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .schedule-list-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .schedule-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            font-size: 14px;
            border-radius: 12px;
            color: var(--text-main);
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .schedule-item.active-now {
            background: var(--accent);
            color: #ffffff;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(0,113,227,0.3);
        }
        .schedule-item span:last-child {
            opacity: 0.6;
            font-size: 12px;
            font-weight: 600;
        }
        .schedule-item.active-now span:last-child {
            opacity: 0.9;
        }
        #loading-screen {
            font-size: 18px;
            font-weight: 600;
            color: #8e8e93;
            text-align: center;
            margin-top: 40vh;
        }
    </style>
</head>
<body>

    <div id="loading-screen">Загрузка системы стиля и времени...</div>

    <div class="main-wrapper" id="app-screen" style="display:none;">
        <div class="controls-panel">
            <button class="theme-btn" id="theme-toggle">🌓 Тема</button>
            <select class="bg-select" id="bg-selector">
                <option value="none">Без фона</option>
                <option value="panel">🌆 Панельки 90-х</option>
                <option value="cars">🚗 Ретро авто</option>
                <option value="mc">🧱 Майнкрафт</option>
            </select>
        </div>

        <div class="day-info" id="current-time-display">--:--</div>

        <div class="child-card">
            <div class="child-name">Кирилл</div>
            <div class="status-box">
                <div class="current-lesson" id="c1-title">Определение статуса...</div>
                <div class="timer" id="c1-timer">--:--</div>
                <div class="next-break" id="c1-break">Перемена: --</div>
            </div>
        </div>

        <div class="full-schedule-box">
            <div class="schedule-title" id="list-title">Расписание</div>
            <div class="schedule-list-container" id="schedule-list"></div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
