<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Расписание Кирилла</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=JetBrains+Mono:wght@900&family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    
    <div class="swiper-container" id="swiper">
        <!-- СЛАЙД 1 -->
        <div class="slide" id="slide-day">
            <div class="header-widget gyro-tilt"><h1>Расписание Кирилла</h1></div>
            <div class="timer-card gyro-tilt">
                <div class="timer-status" id="timer-label">Загрузка...</div>
                <div class="timer-countdown" id="timer-time">00:00</div>
                <div class="timer-sub" id="timer-sub">анализ...</div>
            </div>
            <div class="day-schedule-box gyro-tilt">
                <div class="day-title" id="day-title">Сегодня</div>
                <div class="lessons-list" id="day-lessons"></div>
            </div>
        </div>
        <!-- СЛАЙД 2 -->
        <div class="slide" id="slide-week">
            <div class="header-widget gyro-tilt"><h1>Вся неделя</h1></div>
            <div class="week-matrix-box gyro-tilt"><div class="matrix-grid" id="matrix-grid"></div></div>
        </div>
    </div>

    <!-- Неподвижная премиум-панель навигации со скользящей кареткой -->
    <div class="navigation-tabs">
        <div class="nav-carriage" id="nav-carriage"></div>
        <button class="tab-btn active" id="btn-tab-0" onclick="switchScreen(0)">День</button>
        <button class="tab-btn" id="btn-tab-1" onclick="switchScreen(1)">Неделя</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
