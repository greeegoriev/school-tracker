<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трекер Кирилла</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-overlay: rgba(255, 255, 255, 0.45);
            --card-bg: rgba(255, 255, 255, 0.75);
            --text-main: #1d1d1f;
            --text-muted: #515154;
            --accent: #ff3b30; /* Стильный неоново-красный акцент */
            --status-color: #34c759;
            --border-glow: rgba(255, 255, 255, 0.6);
            --blur: blur(40px);
        }
        body.dark-theme {
            --bg-overlay: rgba(20, 20, 25, 0.55);
            --card-bg: rgba(35, 35, 40, 0.7);
            --text-main: #f5f5f7;
            --text-muted: #a1a1a6;
            --accent: #ff453a;
            --border-glow: rgba(255, 255, 255, 0.08);
        }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: flex-start;
            background-color: #0b0c10;
            overflow-x: hidden;
            box-sizing: border-box;
        }
        .parallax-container {
            position: fixed;
            top: -10%; left: -10%; width: 120%; height: 120%;
            z-index: -2;
            background-size: cover;
            background-position: center;
            transition: background-image 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform;
        }
        /* Яркие, дорогие Mesh-градиенты на фоне */
        .mesh-glow {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(at 10% 20%, #4facfe 0px, transparent 40%),
                        radial-gradient(at 90% 10%, #00f2fe 0px, transparent 35%),
                        radial-gradient(at 50% 80%, #ff0844 0px, transparent 45%);
            mix-blend-mode: multiply;
            opacity: 0.6;
        }
        body.dark-theme .mesh-glow {
            mix-blend-mode: screen;
            opacity: 0.4;
        }
        .main-wrapper {
            background: var(--bg-overlay);
            padding: 24px;
            border-radius: 36px;
            width: 100%;
            max-width: 390px;
            box-sizing: border-box;
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.15), inset 0 1px 0 rgba(255,255,255,0.4);
            border: 1px solid var(--border-glow);
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 5vh;
            transform: translateZ(0);
        }
        .controls-panel {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 12px;
            width: 100%;
        }
        /* Высокотехнологичные минималистичные кнопки */
        .icon-btn {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: var(--text-main);
            width: 44px;
            height: 44px;
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.04);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .icon-btn svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: var(--text-main);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.3s;
        }
        .icon-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.08);
            background: rgba(255,255,255,0.9);
        }
        .icon-btn:active { transform: translateY(1px) scale(0.95); }
        
        .day-info {
            text-align: center;
            font-weight: 700;
            color: var(--text-main);
            font-size: 13px;
            background: rgba(255,255,255,0.25);
            padding: 12px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        body.dark-theme .day-info { background: rgba(0,0,0,0.15); }

        .child-card {
            background: var(--card-bg);
            border-radius: 28px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.02);
            border: 1px solid rgba(255,255,255,0.2);
            box-sizing: border-box;
            width: 100%;
        }
        .child-name {
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 16px;
            color: var(--text-main);
            text-align: center;
            letter-spacing: -0.8px;
        }
        .status-box {
            background: rgba(255,255,255,0.4);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.3);
        }
        body.dark-theme .status-box { background: rgba(0,0,0,0.15); border: 1px solid rgba(255,255,255,0.02); }
        
        .current-lesson { font-size: 16px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .timer { font-size: 42px; font-weight: 900; color: var(--status-color); margin: 10px 0; letter-spacing: -1px; }
        .next-break { font-size: 14px; color: var(--text-main); line-height: 1.5; font-weight: 600; }
        
        .full-schedule-box {
            background: var(--card-bg);
            border-radius: 28px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.15);
        }
        .schedule-title {
            font-size: 12px;
            font-weight: 800;
            margin-bottom: 16px;
            text-align: center;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .schedule-list-container { display: flex; flex-direction: column; gap: 6px; }
        .schedule-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            font-size: 14px;
            border-radius: 14px;
            color: var(--text-main);
            font-weight: 600;
            gap: 12px;
            background: rgba(255,255,255,0.25);
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s ease;
        }
        body.dark-theme .schedule-item { background: rgba(0,0,0,0.1); }
        
        .schedule-item.active-now {
            background: var(--text-main);
            color: var(--card-bg);
            font-weight: 800;
            box-shadow: 0 12px 24px rgba(0,0,0,0.15);
            border-color: transparent;
        }
        .lesson-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
        .time-text { opacity: 0.6; font-size: 12px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; flex-shrink: 0; }
        #loading-screen { font-size: 16px; font-weight: 600; color: #8e8e93; text-align: center; margin-top: 45vh; }
    </style>
</head>
<body>

    <div id="parallax-bg" class="parallax-container"></div>
    <div class="mesh-glow"></div>

    <div id="loading-screen">Загрузка космического интерфейса...</div>

    <div class="main-wrapper" id="app-screen" style="display:none;">
        <div class="controls-panel">
            <!-- Стильные минималистичные SVG иконки вместо эмодзи -->
            <button class="icon-btn" id="bg-toggle" title="Сменить фон">
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            </button>
            <button class="icon-btn" id="theme-toggle" title="Переключить тему">
                <svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
        </div>

        <div class="day-info" id="current-time-display">--:--</div>

        <div class="child-card">
            <div class="child-name">Кирилл</div>
            <div class="status-box">
                <div class="current-lesson" id="c1-title">Определение статуса...</div>
                <div class="timer" id="c1-timer">--:--</div>
                <div class="next-break" id="c1-break">Перемена: --</div>
            </div>
        </div>

        <div class="full-schedule-box">
            <div class="schedule-title" id="list-title">Расписание дня</div>
            <div class="schedule-list-container" id="schedule-list"></div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
