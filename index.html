<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расписание Кирилла</title>
    <!-- Подключаем стили -->
    <link rel="stylesheet" href="https://netlify.app">
</head>
<body>

    <div id="loading-screen">Загрузка системы времени и авторизации...</div>

    <!-- ЭКРАН ВХОДА -->
    <div id="auth-screen" style="display:none;">
        <h2>Вход в трекер</h2>
        <p id="auth-message">Доступ только для членов семьи</p>
        <button id="login-btn">
            <img src="https://gstatic.com" width="20" alt="Google">
            Войти через Google
        </button>
    </div>

    <!-- ОСНОВНОЙ ЭКРАН -->
    <div id="app-screen" style="display:none;">
        <h1>🏫 Школьный трекер времени</h1>
        <div class="logout-area">
            <button class="logout-btn" id="logout-btn">Выйти из аккаунта</button>
        </div>
        <div class="day-info" id="current-time-display">Загрузка времени...</div>

        <div class="child-card">
            <div class="child-name">Кирилл</div>
            <div class="status-box">
                <div class="current-lesson" id="c1-title">Определение статуса...</div>
                <div class="timer" id="c1-timer">--:--</div>
                <div class="next-break" id="c1-break">Перемена: --</div>
            </div>
        </div>
    </div>

    <!-- Подключаем всю логику одной безопасной строчкой -->
    <script type="module" src="https://netlify.app"></script>
</body>
</html>
