<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расписание Кирилла</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #f7f9fc;
            --bg-overlay: rgba(255, 255, 255, 0.25);
            --card-bg: rgba(255, 255, 255, 0.65);
            --text-main: #1d1d1f;
            --text-muted: #6e6e73;
            --accent: #0071e3;
            --status-color: #34c759;
            --border-glow: rgba(255, 255, 255, 0.8);
            --blur: blur(35px);
        }
        body.dark-theme {
            --bg-base: #08090c;
            --bg-overlay: rgba(15, 16, 20, 0.45);
            --card-bg: rgba(30, 30, 35, 0.6);
            --text-main: #f5f5f7;
            --text-muted: #8e8e93;
            --accent: #2997ff;
            --border-glow: rgba(255, 255, 255, 0.05);
        }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: flex-start;
            background-color: var(--bg-base);
            overflow-x: hidden;
            box-sizing: border-box;
            transition: background-color 0.5s ease;
            padding-bottom: 90px;
        }
        .parallax-container {
            position: fixed;
            top: -10%; left: -10%; width: 120%; height: 120%;
            z-index: -2;
            background-size: cover;
            background-position: center;
            transition: background-image 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform;
        }
        .mesh-glow {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(at 20% 15%, #a1c4fd 0px, transparent 50%),
                        radial-gradient(at 80% 10%, #c2e9fb 0px, transparent 40%),
                        radial-gradient(at 50% 85%, #f6d365 0px, transparent 45%);
            opacity: 0.6;
        }
        body.dark-theme .mesh-glow {
            background: radial-gradient(at 10% 20%, #1a365d 0px, transparent 40%),
                        radial-gradient(at 90% 10%, #0f4c5c 0px, transparent 35%),
                        radial-gradient(at 50% 80%, #5c1328 0px, transparent 45%);
            mix-blend-mode: screen;
            opacity: 0.4;
        }
        .main-wrapper {
            background: var(--bg-overlay);
            padding: 24px;
            border-radius: 40px;
            width: 100%;
            max-width: 390px;
            box-sizing: border-box;
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.04), inset 0 1px 0 rgba(255,255,255,0.6);
            border: 1px solid var(--border-glow);
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 4vh;
            transform: translateZ(0);
        }
        /* СТИЛЬНАЯ ФОРМА ВХОДА */
        #login-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: center;
            padding: 10px 0;
        }
        #login-form h2 { font-size: 20px; font-weight: 800; margin: 0 0 5px 0; color: var(--text-main); }
        .pass-input {
            background: rgba(255,255,255,0.5);
            border: 1px solid rgba(0,0,0,0.08);
            padding: 14px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 600;
            outline: none;
            text-align: center;
            color: var(--text-main);
            transition: all 0.2s;
        }
        body.dark-theme .pass-input { background: rgba(0,0,0,0.2); border-color: rgba(255,255,255,0.05); }
        .pass-input:focus { border-color: var(--accent); background: rgba(255,255,255,0.8); }
        .login-btn {
            background: var(--text-main);
            color: var(--bg-base);
            border: none;
            padding: 14px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .login-btn:active { transform: scale(0.97); }
        
        .bottom-nav {
            position: fixed;
            bottom: 24px;
            display: flex;
            gap: 16px;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 8px 16px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid rgba(255,255,255,0.4);
            z-index: 10;
        }
        body.dark-theme .bottom-nav { background: rgba(30, 30, 35, 0.5); border: 1px solid rgba(255,255,255,0.05); }
        .icon-btn {
            background: transparent; border: none; color: var(--text-main);
            width: 44px; height: 44px; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            transition: transform 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .icon-btn svg { width: 22px; height: 22px; fill: none; stroke: var(--text-main); stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; opacity: 0.8; }
        .icon-btn:hover { transform: scale(1.1); }
        
        .day-info { text-align: center; font-weight: 700; color: var(--text-main); font-size: 13px; background: rgba(255,255,255,0.3); padding: 10px 14px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.4); text-transform: uppercase; letter-spacing: 0.5px; }
        body.dark-theme .day-info { background: rgba(0,0,0,0.15); border: 1px solid rgba(255,255,255,0.01); }
        .child-card { background: var(--card-bg); border-radius: 30px; padding: 24px; border: 1px solid rgba(255,255,255,0.4); box-sizing: border-box; width: 100%; }
        body.dark-theme .child-card { border: 1px solid rgba(255,255,255,0.04); }
        .child-name { font-size: 26px; font-weight: 900; margin-bottom: 14px; color: var(--text-main); text-align: center; letter-spacing: -0.5px; }
        .status-box { background: rgba(255,255,255,0.5); border-radius: 20px; padding: 20px; text-align: center; border: 1px solid rgba(255,255,255,0.5); }
        body.dark-theme .status-box { background: rgba(0,0,0,0.12); border: 1px solid transparent; }
        .current-lesson { font-size: 13px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px; }
        .timer { font-size: 36px; font-weight: 900; color: var(--status-color); margin: 8px 0; letter-spacing: -0.5px; line-height: 1.2; }
        .next-break { font-size: 14px; color: var(--text-main); line-height: 1.5; font-weight: 600; }
        .full-schedule-box { background: var(--card-bg); border-radius: 30px; padding: 20px; border: 1px solid rgba(255,255,255,0.4); }
        body.dark-theme .full-schedule-box { border: 1px solid rgba(255,255,255,0.04); }
        .schedule-title { font-size: 11px; font-weight: 800; margin-bottom: 14px; text-align: center; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        .schedule-list-container { display: flex; flex-direction: column; gap: 6px; }
        .schedule-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; font-size: 14px; border-radius: 14px; color: var(--text-main); font-weight: 600; gap: 12px; background: rgba(255,255,255,0.3); border: 1px solid rgba(255,255,255,0.1); }
        body.dark-theme .schedule-item { background: rgba(0,0,0,0.08); border: 1px solid transparent; }
        .schedule-item.active-now { background: var(--text-main); color: var(--bg-base); font-weight: 800; box-shadow: 0 10px 20px rgba(0,0,0,0.06); border-color: transparent; }
        .lesson-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
        .time-text { opacity: 0.6; font-size: 12px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; flex-shrink: 0; }
    </style>
</head>
<body>

    <div id="parallax-bg" class="parallax-container"></div>
    <div class="mesh-glow"></div>

    <div class="main-wrapper">
        <!-- БЛОК ВХОДА (Показывается если не введен пароль) -->
        <div id="login-form">
            <h2>Доступ к расписанию</h2>
            <input type="password" id="pass-field" class="pass-input" placeholder="Введите семейный пароль">
            <button id="submit-pass" class="login-btn">Войти</button>
        </div>

        <!-- ОСНОВНОЙ КОНТЕНТ (По умолчанию скрыт) -->
        <div id="app-content" style="display: none; flex-direction: column; gap: 16px;">
            <div class="day-info" id="current-time-display">--:--</div>
            <div class="child-card">
                <div class="child-name">Кирилл</div>
                <div class="status-box">
                    <div class="current-lesson" id="c1-title">Определение статуса...</div>
                    <div class="timer" id="c1-timer">--:--</div>
                    <div class="next-break" id="c1-break">Перемена: --</div>
                </div>
            </div>
            <div class="full-schedule-box">
                <div class="schedule-title" id="list-title">Расписание дня</div>
                <div class="schedule-list-container" id="schedule-list"></div>
            </div>
        </div>
    </div>

    <div class="bottom-nav" id="nav-panel" style="display:none;">
