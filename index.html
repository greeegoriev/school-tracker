
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Расписание Кирилла</title>
    <style>
        :root {
            --bg-blur: 20px;
            --card-radius: 24px;
            --transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        
        .light-theme {
            --text-main: #1d1d1f;
            --text-sub: #6e6e73;
            --glass-bg: rgba(255, 255, 255, 0.4);
            --glass-border: rgba(255, 255, 255, 0.6);
            --glass-shadow: rgba(0, 0, 0, 0.05);
            --accent: #0071e3;
            --accent-bg: rgba(0, 113, 227, 0.15);
            --card-active: rgba(255, 255, 255, 0.75);
        }

        .dark-theme {
            --text-main: #f5f5f7;
            --text-sub: #86868b;
            --glass-bg: rgba(20, 20, 25, 0.4);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-shadow: rgba(0, 0, 0, 0.3);
            --accent: #2997ff;
            --accent-bg: rgba(41, 151, 255, 0.2);
            --card-active: rgba(30, 30, 40, 0.75);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #2e1065);
            background-attachment: fixed;
            min-height: 100vh;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-x: hidden;
            padding: 20px 16px cubic-bezier(0.1, 0, 0.1, 1);
            transition: var(--transition);
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
            transition: opacity 1s ease;
        }

        .app-container {
            width: 100%;
            max-width: 440px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding-bottom: 40px;
            z-index: 1;
        }

        header {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--bg-blur));
            -webkit-backdrop-filter: blur(var(--bg-blur));
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px var(--glass-shadow);
            border-radius: var(--card-radius);
            padding: 24px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        header h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
            background: linear-gradient(90deg, var(--text-main), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            background: var(--accent-bg);
            color: var(--accent);
            margin-top: 10px;
            border: 1px solid rgba(41, 151, 255, 0.2);
        }

        .controls-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }

        .btn {
            flex: 1;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--bg-blur));
            -webkit-backdrop-filter: blur(var(--bg-blur));
            border: 1px solid var(--glass-border);
            box-shadow: 0 4px 16px var(--glass-shadow);
            color: var(--text-main);
            padding: 14px;
            border-radius: 18px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: var(--transition);
        }

        .btn:active {
            transform: scale(0.96);
            background: var(--glass-border);
        }

        .day-title {
            font-size: 18px;
            font-weight: 700;
            padding-left: 8px;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .day-title span {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-sub);
            background: var(--glass-bg);
            padding: 4px 10px;
            border-radius: 10px;
        }

        .schedule-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .lesson-card {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--bg-blur));
            -webkit-backdrop-filter: blur(var(--bg-blur));
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 24px var(--glass-shadow);
            border-radius: var(--card-radius);
            padding: 18px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            transition: var(--transition);
        }

        .lesson-card.active {
            background: var(--card-active);
            border-color: var(--accent);
            box-shadow: 0 12px 32px rgba(41, 151, 255, 0.25);
            transform: scale(1.02);
        }

        .lesson-card.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 5px;
            background: var(--accent);
        }

        .lesson-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }

        .lesson-num-time {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .lesson-name {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-main);
        }

        .lesson-room {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-sub);
        }

        .lesson-timer {
            text-align: right;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-end;
        }

        .timer-val {
            font-size: 15px;
            font-weight: 700;
            color: var(--accent);
        }

        .timer-lbl {
            font-size: 11px;
            color: var(--text-sub);
            margin-top: 2px;
        }

        .break-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px dashed var(--glass-border);
            border-radius: 16px;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--text-sub);
            transition: var(--transition);
        }

        .break-card.active {
            background: var(--accent-bg);
            border-style: solid;
            border-color: var(--accent);
            color: var(--text-main);
        }

        .empty-day {
            text-align: center;
            padding: 40px;
            color: var(--text-sub);
            font-size: 15px;
        }

        .nav-tabs {
            display: flex;
            background: var(--glass-bg);
            padding: 4px;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
        }

        .tab-btn {
            flex: 1;
            border: none;
            background: transparent;
            color: var(--text-sub);
            padding: 10px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: var(--transition);
        }

        .tab-btn.active {
            background: var(--accent);
            color: #fff;
        }
    </style>
</head>
<body class="dark-theme">

    <canvas id="bg-canvas"></canvas>

    <div class="app-container">
        <header id="app-header">
            <h1>Расписание Кирилла</h1>
            <div id="live-status" class="status-badge">Загрузка статуса...</div>
        </header>

        <div class="controls-row">
            <button class="btn" id="btn-theme">🌓 Тема: Авто</button>
            <button class="btn" id="btn-bg">🎨 Сгенерировать фон</button>
        </div>

        <div class="nav-tabs">
            <button class="tab-btn" id="tab-auto" onclick="switchView('auto')">Авто-день</button>
            <button class="tab-btn" id="tab-all" onclick="switchView('all')">Все дни</button>
        </div>

        <div id="schedule-container"></div>
    </div>

    <script>
        const scheduleData = {
            1: {
                name: "Понедельник",
                lessons: [
                    { num: 1, time: "08:30 - 09:10", subject: "Физика", room: "301 каб." },
                    { num: 2, time: "09:20 - 10:00", subject: "Литература", room: "308 каб." },
                    { num: 3, time: "10:20 - 11:00", subject: "История", room: "210 каб." },
                    { num: 4, time: "11:10 - 11:50", subject: "Алгебра", room: "313 каб." },
                    { num: 5, time: "12:10 - 12:50", subject: "Вероятность", room: "313 каб." },
                    { num: 6, time: "13:10 - 13:50", subject: "Физкультура", room: "2 этаж, спорт.зал" },
                    { num: 7, time: "14:00 - 14:40", subject: "Информатика", room: "301 каб." }
                ]
            },
            2: {
                name: "Вторник",
                lessons: [
                    { num: 2, time: "09:20 - 10:00", subject: "География", room: "306 каб." },
                    { num: 3, time: "10:20 - 11:00", subject: "Труд", room: "201 каб." },
                    { num: 4, time: "11:10 - 11:50", subject: "История", room: "210 каб." },
                    { num: 5, time: "12:10 - 12:50", subject: "Русский язык", room: "308 каб." },
                    { num: 6, time: "13:10 - 13:50", subject: "Музыка", room: "303 каб." },
                    { num: 7, time: "14:00 - 14:40", subject: "Алгебра", room: "313 каб." },
                    { num: 8, time: "14:50 - 15:30", subject: "Геометрия", room: "313 каб." }
                ]
            },
            3: {
                name: "Среда",
                lessons: [
                    { num: 1, time: "08:30 - 09:10", subject: "ОБЗР", room: "203 каб." },
                    { num: 2, time: "09:20 - 10:00", subject: "Биология", room: "306 каб." },
                    { num: 3, time: "10:20 - 11:00", subject: "Физкультура", room: "2 этаж, спорт.зал" },
                    { num: 4, time: "11:10 - 11:50", subject: "Англ.язык", room: "305 каб." },
                    { num: 5, time: "12:10 - 12:50", subject: "Физика", room: "301 каб." },
                    { num: 6, time: "13:10 - 13:50", subject: "География", room: "306 каб." }
                ]
            },
            4: {
                name: "Четверг",
                lessons: [
                    { num: 3, time: "10:20 - 11:00", subject: "Биология", room: "203 каб." },
                    { num: 4, time: "11:10 - 11:50", subject: "Англ.язык", room: "305 каб." },
                    { num: 5, time: "12:10 - 12:50", subject: "История", room: "210 каб." },
                    { num: 6, time: "13:10 - 13:50", subject: "Русский язык", room: "308 каб." },
                    { num: 7, time: "14:00 - 14:40", subject: "Химия", room: "316 каб." }
                ]
            },
            5: {
                name: "Пятница",
                lessons: [
                    { num: 3, time: "10:20 - 11:00", subject: "Химия", room: "316 каб." },
                    { num: 4, time: "11:10 - 11:50", subject: "Алгебра", room: "313 каб." },
                    { num: 5, time: "12:10 - 12:50", subject: "Русский язык", room: "308 каб." },
                    { num: 6, time: "13:10 - 13:50", subject: "Англ.язык", room: "305 каб." },
                    { num: 7, time: "14:00 - 14:40", subject: "Литература", room: "308 каб." },
                    { num: 8, time: "14:50 - 15:30", subject: "Геометрия", room: "313 каб." }
                ]
            }
        };

        const intervals = [
            { start: "08:30", end: "09:10", type: "lesson", num: 1 },
            { start: "09:10", end: "09:20", type: "break", next: 2 },
            { start: "09:20", end: "10:00", type: "lesson", num: 2 },
            { start: "10:00", end: "10:20", type: "break", next: 3 },
            { start: "10:20", end: "11:00", type: "lesson", num: 3 },
            { start: "11:00", end: "11:10", type: "break", next: 4 },
            { start: "11:10", end: "11:50", type: "lesson", num: 4 },
            { start: "11:50", end: "12:10", type: "break", next: 5 },
            { start: "12:10", end: "12:50", type: "lesson", num: 5 },
            { start: "12:50", end: "13:10", type: "break", next: 6 },
            { start: "13:10", end: "13:50", type: "lesson", num: 6 },
            { start: "13:50", end: "14:00", type: "break", next: 7 },
            { start: "14:00", end: "14:40", type: "lesson", num: 7 },
            { start: "14:40", end: "14:50", type: "break", next: 8 },
            { start: "14:50", end: "15:30", type: "lesson", num: 8 }
        ];

        let currentView = 'auto'; // 'auto' or 'all'
        let themeMode = 'auto'; // 'auto', 'light', 'dark'

        function timeToMin(timeStr) {
            const [h, m] = timeStr.split(':').map(Number);
            return h * 60 + m;
        }

        function getCurrentStatus() {
            const now = new Date();
            let day = now.getDay(); 
            const currentMin = now.getHours() * 60 + now.getMinutes();

            // For testing at night/weekends or when day is 0, 6 -> Weekend
            let isWeekend = (day === 0 || day === 6);
            
            // Check if today's lessons are over
            let todaySchedule = scheduleData[day];
            let lastLessonEnd = 0;
            if (todaySchedule && todaySchedule.lessons.length > 0) {
                const lastTime = todaySchedule.lessons[todaySchedule.lessons.length - 1].time.split(' - ')[1];
                lastLessonEnd = timeToMin(lastTime);
            }

            let displayDay = day;
            let showTomorrow = false;

            if (isWeekend || currentMin > lastLessonEnd || !todaySchedule) {
                showTomorrow = true;
                // find next school day
                displayDay = day + 1;
                if (displayDay > 5 || displayDay === 0) displayDay = 1; // Loop back to Monday
            }

            // Find current active lesson or break
            let activeInterval = null;
            if (!showTomorrow && todaySchedule) {
                for (const inter of intervals) {
                    const s = timeToMin(inter.start);
                    const e = timeToMin(inter.end);
                    if (currentMin >= s && currentMin < e) {
                        activeInterval = { ...inter, remaining: e - currentMin };
                        break;
                    }
                }
            }

            return {
                dayToShow: displayDay,
                isTomorrow: showTomorrow,
                activeInterval: activeInterval
            };
        }

        function generateGradient() {
            const canvas = document.getElementById('bg-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const isDark = document.body.classList.contains('dark-theme');
            
            ctx.clearRect(0,0,canvas.width,canvas.height);
            
            // Modern premium fluid gradients using 3 color stops
            const palettesDark = [
                ['#0f172a', '#1e1b4b', '#2e1065'],
                ['#020617', '#111827', '#311042'],
                ['#070a13', '#0f172a', '#1e293b']
            ];
            
            const palettesLight = [
                ['#f8fafc', '#e2e8f0', '#cbd5e1'],
                ['#f1f5f9', '#f8fafc', '#e2e8f0'],
                ['#eff6ff', '#dbeafe', '#bfdbfe']
            ];

            const palette = isDark ? palettesDark[Math.floor(Math.random()*palettesDark.length)] : palettesLight[Math.floor(Math.random()*palettesLight.length)];
            
            let grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            grad.addColorStop(0, palette[0]);
            grad.addColorStop(0.5, palette[1]);
            grad.addColorStop(1, palette[2]);
            
            ctx.fillStyle = grad;
            ctx.fillRect(0,0,canvas.width,canvas.height);
        }

        function switchView(view) {
            currentView = view;
            document.getElementById('tab-auto').classList.toggle('active', view === 'auto');
            document.getElementById('tab-all').classList.toggle('active', view === 'all');
            renderSchedule();
        }

        function renderSchedule() {
            const status = getCurrentStatus();
            const container = document.getElementById('schedule-container');
            container.innerHTML = '';

            // Update status badge
            const statusBadge = document.getElementById('live-status');
            if (status.activeInterval) {
                if (status.activeInterval.type === 'lesson') {
                    statusBadge.innerText = `Идёт ${status.activeInterval.num}-й урок. Осталось ${status.activeInterval.remaining} мин`;
                } else {
                    statusBadge.innerText = `Перемена перед ${status.activeInterval.next}-м уроком. Осталось ${status.activeInterval.remaining} мин`;
                }
            } else {
                statusBadge.innerText = status.isTomorrow ? "Учебный день окончен (Показ завтра)" : "Уроки ещё не начались";
            }

            if (currentView === 'auto') {
                renderSingleDay(status.dayToShow, status.isTomorrow ? "Завтра" : "Сегодня", container, status.activeInterval);
            } else {
                for (let d = 1; d <= 5; d++) {
                    renderSingleDay(d, '', container, status.activeInterval, status.dayToShow === d && !status.isTomorrow);
                }
            }
        }

        function renderSingleDay(dayNum, customLabel, container, activeInterval, isTodayAllMode = false) {
            const dayData = scheduleData[dayNum];
            if (!dayData) return;

            const dayBlock = document.createElement('div');
            dayBlock.className = 'schedule-list';
            dayBlock.style.marginBottom = '24px';

            const title = document.createElement('div');
            title.className = 'day-title';
            title.innerHTML = `${dayData.name} ${customLabel ? `<span>${customLabel}</span>` : ''}`;
            dayBlock.appendChild(title);

            // Complete lesson list map with breaks inserted
            let currentStatus = getCurrentStatus();
            let checkDay = currentStatus.dayToShow;

            dayData.lessons.forEach((lesson, index) => {
                const card = document.createElement('div');
                card.className = 'lesson-card';
                
                // Active highlighting logic
                const isActiveLesson = activeInterval && activeInterval.type === 'lesson' && activeInterval.num === lesson.num && dayNum === currentStatus.dayToShow && !currentStatus.isTomorrow;
                if (isActiveLesson) {
                    card.classList.add('active');
                }

                let timerHtml = '';
                if (isActiveLesson) {
                    timerHtml = `<div class="lesson-timer"><span class="timer-val">${activeInterval.remaining}м</span><span class="timer-lbl">до конца</span></div>`;
                }

                card.innerHTML = `
                    <div class="lesson-info">
                        <span class="lesson-num-time">${lesson.num} Урок • ${lesson.time}</span>
                        <span class="lesson-name">${lesson.subject}</span>
                        <span class="lesson-room">${lesson.room}</span>
                    </div>
                    ${timerHtml}
                `;
                dayBlock.appendChild(card);

                // Add break card if not the last item
                if (index < dayData.lessons.length - 1) {
                    const nextLesson = dayData.lessons[index + 1];
                    // Find break between this lesson and next
                    const breakInter = intervals.find(i => i.type === 'break' && i.next === nextLesson.num);
                    if (breakInter) {
                        const breakCard = document.createElement('div');
                        breakCard.className = 'break-card';
                        const isActiveBreak = activeInterval && activeInterval.type === 'break' && activeInterval.next === nextLesson.num && dayNum === currentStatus.dayToShow && !currentStatus.isTomorrow;
                        
                        if (isActiveBreak) {
                            breakCard.classList.add('active');
                            breakCard.innerHTML = `<span>Перемена</span><span>Осталось ${activeInterval.remaining} мин</span>`;
                        } else {
                            breakCard.innerHTML = `<span>Перемена (${breakInter.start.split(':')[1] ? '10-20' : ''} мин)</span><span>${breakInter.start} - ${breakInter.end}</span>`;
                        }
                        dayBlock.appendChild(breakCard);
                    }
                }
            });

            container.appendChild(dayBlock);
        }

        // Automatic Light/Dark mode detection
        function initTheme() {
            const hour = new Date().getHours();
            const isDark = hour < 7 || hour > 19;
            document.body.className = isDark ? 'dark-theme' : 'light-theme';
            generateGradient();
        }

        document.getElementById('btn-theme').addEventListener('click', () => {
            if (document.body.classList.contains('dark-theme')) {
                document.body.className = 'light-theme';
                document.getElementById('btn-theme').innerText = '🌓 Тема: Светлая';
            } else {
                document.body.className = 'dark-theme';
                document.getElementById('btn-theme').innerText = '🌓 Тема: Тёмная';
            }
            generateGradient();
        });

        document.getElementById('btn-bg').addEventListener('click', generateGradient);

        // Parallax effect via phone rotation or touch interaction simulation for maximum compatibility
        window.addEventListener('mousemove', (e) => {
            const header = document.getElementById('app-header');
            const x = (window.innerWidth / 2 - e.clientX) / 30;
            const y = (window.innerHeight / 2 - e.clientY) / 30;
            header.style.transform = `rotateY(${x}deg) rotateX(${-y}deg)`;
        });

        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', (e) => {
                const header = document.getElementById('app-header');
                const tiltX = Math.clip ? Math.clip(e.gamma, -20, 20) : e.gamma / 2;
                const tiltY = Math.clip ? Math.clip(e.beta, -20, 20) : e.beta / 2;
                if(tiltX && tiltY) {
                    header.style.transform = `rotateY(${tiltX}deg) rotateX(${-tiltY}deg)`;
                }
            });
        }

        // Run application
        initTheme();
        renderSchedule();
        setInterval(renderSchedule, 30000); // refresh every 30 seconds
        window.addEventListener('resize', generateGradient);
    </script>
</body>
</html>
